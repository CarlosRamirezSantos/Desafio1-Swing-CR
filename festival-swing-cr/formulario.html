<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de evento</title>
  <link rel="icon" type="image/png" href="assets/imagenes/Logo.png">
  <link rel="stylesheet" href="src/variables.css">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar__logo">
      <img src="assets/imagenes/Logo.png" alt="Logo swingCR" class="navbar__logo-img">
    </div>
    <ul class="navbar__menu">
      <li><a href="#" class="navbar__link navbar__link">Inicio</a></li>
      <li><a href="#" class="navbar__link">Eventos</a></li>
    </ul>
  </nav>
  <main>
    <form class="form-evento">
      <h2>Registra tu evento</h2>
      <div class="form-evento__tipo">
        <label for="radioClase"><input id="radioClase" type="radio" name="tipoEvento" value="clase" checked> Clase</label>
        <label for="radioActividad"><input id="radioActividad" type="radio" name="tipoEvento" value="actividad"> Actividad</label>
      </div>
      <div class="form-evento__grupo form-evento__grupo--inline">
        <label for="dia">Día
          <select id="dia" name="dia">
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </label>
        <label for="hora">Hora
          <select id="hora" name="hora">
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
            <option value="19:00">19:00</option>
            <option value="20:00">20:00</option>
            <option value="21:00">21:00</option>
            <option value="22:00">22:00</option>
          </select>
        </label>
      </div>
      <div class="form-evento__grupo">
        <label for="nombre">Nombre del organizador
          <input id="nombre" type="text" name="nombre" placeholder="Carlos Ramírez" required maxlength="100" minlength="3" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras y espacios">
        </label>
      </div>
      <div class="form-evento__grupo">
        <label for="ubicacion">Ubicaciones disponibles
          <select id="ubicacion" name="ubicacion"></select>
        </label>
      </div>
      <div class="form-evento__grupo">
        <label for="estilo">Estilo
          <select id="estilo" name="estilo">
            <option value="Lindy Hop">Lindy Hop</option>
            <option value="Shag">Shag</option>
            <option value="Solo Jazz">Solo Jazz</option>
          </select>
        </label>
      </div>
      <div class="form-evento__grupo" id="grupo-nivel">
        <label for="nivel">Nivel
          <select id="nivel" name="nivel">
            <option value="Básico">Básico</option>
            <option value="Intermedio">Intermedio</option>
            <option value="Avanzado">Avanzado</option>
          </select>
        </label>
      </div>
      <div class="form-evento__grupo" id="grupo-tipoActividad">
        <label for="tipoActividad">Tipo de actividad
          <select id="tipoActividad" name="tipoActividad">
            <option value="Taster">Taster</option>
            <option value="Social">Social</option>
            <option value="Concierto">Concierto</option>
            <option value="Mix & Match">Mix & Match</option>
          </select>
        </label>
      </div>
      <div class="form-evento__grupo form-evento__grupo--inline" id="grupo-banda">
        <label for="duracion">Duración (minutos)
          <select id="duracion" name="duracion">
            <option value="60">60</option>
            <option value="120">120</option>
          </select>
        </label>
        <label for="check_p">
          <input type="checkbox" id="check_p"> Profesor
        </label>
        <label for="check_b">
          <input type="checkbox" id="check_b"> Banda
        </label>
      </div>
      <div class="form-evento__grupo">
        <label for="descripcion">Descripción opcional</label>
        <textarea id="descripcion" name="descripcion" placeholder="El evento consiste en ..." rows="4"></textarea>
      </div>
      <button type="submit">Registrar evento</button>
      <div id="mensajeEvento"></div>
    </form>
  </main>
  <script type="module" src="src/formulario.js"></script>
</body>
</html>
